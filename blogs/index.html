  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("theme-toggle").addEventListener("click", function () {
        var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
      });

      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: "$$", right: "$$", display: true},
            {left: "$", right: "$", display: false}
          ]
        });
      }

      // Project-card videos show their first frame and play on hover/focus.
      document.querySelectorAll(".card-media video").forEach(function (v) {
        var card = v.closest("a");
        card.addEventListener("mouseenter", function () { v.play().catch(function () {}); });
        card.addEventListener("focus", function () { v.play().catch(function () {}); });
        card.addEventListener("mouseleave", function () { v.pause(); });
        card.addEventListener("blur", function () { v.pause(); });
      });
    });
  </script>
